; YAME element mappings. This complete file replaces the bundled rules.
; Remove a section to leave that tag unchanged. Restart YAME after editing.
; Comments occupy a whole line; semicolons in style values are preserved.

[main]
target=div

[article]
target=div

[section]
target=div

[nav]
target=div

[header]
target=div

[footer]
target=div

[aside]
target=div

[figure]
target=div

[hgroup]
target=div

[figcaption]
target=p

[time]
target=span

[mark]
target=span

[details]
target=div

[summary]
target=p
style=font-weight:bold;
