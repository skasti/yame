name: Apply PR20 Codex fixes
on:
  push:
    branches:
      - fix/http-compatibility-default-and-links
    paths:
      - .github/workflows/pr20-codex-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/http-compatibility-default-and-links
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply fixes and regression tests
        run: python3 .github/scripts/pr20_patch.py
      - name: Run tests
        run: ./gradlew test
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr20-codex-fix.yml .github/scripts/pr20_patch.py
          git add src/main/kotlin/no/skasti/serialmodem/ppp/HttpCompatibilityProxy.kt src/test/kotlin/no/skasti/serialmodem/ppp/LegacyHttpsUrlCodecTest.kt
          git commit -m "Address Codex URL mapping and charset review"
          git push origin HEAD:fix/http-compatibility-default-and-links
