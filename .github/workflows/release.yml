name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_releases: ${{ steps.plan.outputs.has_releases }}
      latest_tag: ${{ steps.plan.outputs.latest_tag }}
    env:
      # main at the point automatic releases were introduced; this represents v0.1.0.
      RELEASE_BOOTSTRAP_SHA: 5fd66e4a3580ed3667ec65b0675ac28e611132ce

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan releases in main history order
        id: plan
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN repository secret is required to push release tags"
            exit 1
          fi

          # Authenticate only tag pushes. Do not persist the reusable PAT in the
          # checkout configuration, where historical Gradle builds could access it.
          push_release_ref() {
            local auth
            auth="$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w 0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push "$@"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force origin main
          git fetch --force --tags origin

          lock_tag="release-version-lock"
          lock_acquired=false
          owned_lock_oid=""

          release_lock() {
            if [ "$lock_acquired" = true ] && [ -n "$owned_lock_oid" ]; then
              # Delete only the exact lock object this run created. If another run has
              # replaced it, --force-with-lease refuses to remove the new owner's lock.
              push_release_ref \
                --force-with-lease="refs/tags/$lock_tag:$owned_lock_oid" \
                origin ":refs/tags/$lock_tag" >/dev/null 2>&1 || true
              git tag -d "$lock_tag" >/dev/null 2>&1 || true
              lock_acquired=false
              owned_lock_oid=""
            fi
          }
          trap release_lock EXIT

          while [ "$lock_acquired" = false ]; do
            observed_lock_oid="$(
              git ls-remote --tags origin "refs/tags/$lock_tag" | awk '{print $1}'
            )"

            if [ -n "$observed_lock_oid" ]; then
              # Fetch and verify the exact object we observed before considering it
              # stale. The ref may have changed between ls-remote and fetch.
              if ! git fetch --force origin "refs/tags/$lock_tag:refs/tags/$lock_tag" >/dev/null 2>&1; then
                sleep 2
                continue
              fi

              fetched_lock_oid="$(git rev-parse "refs/tags/$lock_tag")"
              if [ "$fetched_lock_oid" != "$observed_lock_oid" ]; then
                sleep 2
                continue
              fi

              lock_time="$(
                git for-each-ref --format='%(taggerdate:unix)' "refs/tags/$lock_tag"
              )"
              now="$(date +%s)"

              if [ -n "$lock_time" ] && [ $((now - lock_time)) -gt 900 ]; then
                echo "Removing stale release version lock $observed_lock_oid"
                push_release_ref \
                  --force-with-lease="refs/tags/$lock_tag:$observed_lock_oid" \
                  origin ":refs/tags/$lock_tag" >/dev/null 2>&1 || true
                git tag -d "$lock_tag" >/dev/null 2>&1 || true
              else
                sleep 2
              fi
              continue
            fi

            git tag -d "$lock_tag" >/dev/null 2>&1 || true
            git tag -a "$lock_tag" -m "Release version lock for workflow run $GITHUB_RUN_ID" "origin/main"
            candidate_lock_oid="$(git rev-parse "refs/tags/$lock_tag")"

            if push_release_ref origin "refs/tags/$lock_tag" >/dev/null 2>&1; then
              lock_acquired=true
              owned_lock_oid="$candidate_lock_oid"
            else
              git tag -d "$lock_tag" >/dev/null 2>&1 || true
              sleep 2
            fi
          done

          # Refresh after acquiring the lock. A previous run may have created release tags
          # while this run was waiting.
          git fetch --force origin main
          git fetch --force --tags origin

          : > "$RUNNER_TEMP/releases.tsv"

          latest_tag="$(
            git tag --merged origin/main --list 'v*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          )"

          if [ -n "$latest_tag" ]; then
            base_ref="$latest_tag"
            current_version="${latest_tag#v}"
          else
            base_ref="$RELEASE_BOOTSTRAP_SHA"
            current_version="0.1.0"
          fi

          if ! git merge-base --is-ancestor "$base_ref" origin/main; then
            echo "::error::Release baseline $base_ref is not an ancestor of main"
            exit 1
          fi

          release_asset_name() {
            local commit="$1"
            local version="$2"

            # Commits before the repository rename still build the legacy distribution
            # name. Keep their release assets recoverable under that original name.
            if git show "$commit:settings.gradle.kts" 2>/dev/null |
              grep -Fq 'rootProject.name = "yame"'; then
              printf 'yame-%s.zip' "$version"
            else
              printf 'serial-modem-emulator-%s.zip' "$version"
            fi
          }

          # Fail on permission/API errors instead of treating every tag as missing.
          published_tags="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"

          # First recover any already-reserved SemVer tags whose release publication
          # previously failed, remained a draft, or is missing its expected ZIP asset.
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue

            version="${tag#v}"
            sha="$(git rev-list -n 1 "$tag")"
            expected_asset="$(release_asset_name "$sha" "$version")"
            needs_recovery=false

            if ! grep -Fxq "$tag" <<< "$published_tags"; then
              needs_recovery=true
            else
              if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ]; then
                needs_recovery=true
              fi

              asset_names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
              if ! grep -Fxq "$expected_asset" <<< "$asset_names"; then
                needs_recovery=true
              fi
              if [ "$expected_asset" = "yame-$version.zip" ] &&
                 ! grep -Fxq "yame-$version-linux-arm64.zip" <<< "$asset_names"; then
                needs_recovery=true
              fi
            fi

            if [ "$needs_recovery" = true ]; then
              printf '%s\t%s\t%s\t%s\n' "$tag" "$sha" "$version" "$expected_asset" >> "$RUNNER_TEMP/releases.tsv"
            fi
          done < <(
            git tag --merged origin/main --list 'v*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V
          )

          # Process every not-yet-versioned first-parent commit, oldest first. This
          # preserves main history order even when workflow runs overlap or a single
          # push contains multiple merged PRs.
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue

            pr_number="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
                --jq ".[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$sha\") | .number" |
                tail -n 1
            )"

            if [ -z "$pr_number" ]; then
              echo "Skipping $sha: no merged PR terminates at this commit"
              continue
            fi

            labels="$(
              gh pr view "$pr_number" \
                --repo "$GITHUB_REPOSITORY" \
                --json labels \
                --jq '[.labels[].name] | join(",")'
            )"

            has_major=false
            has_minor=false
            case ",$labels," in
              *",release:major,"*) has_major=true ;;
            esac
            case ",$labels," in
              *",release:minor,"*) has_minor=true ;;
            esac

            if [ "$has_major" = true ] && [ "$has_minor" = true ]; then
              echo "::error::PR #$pr_number must not have both release:major and release:minor labels"
              exit 1
            fi

            IFS='.' read -r major minor patch <<< "$current_version"

            if [ "$has_major" = true ]; then
              major=$((major + 1))
              minor=0
              patch=0
            elif [ "$has_minor" = true ]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi

            version="$major.$minor.$patch"
            tag="v$version"

            git tag "$tag" "$sha"
            push_release_ref origin "refs/tags/$tag"
            current_version="$version"
            expected_asset="$(release_asset_name "$sha" "$version")"

            echo "Reserved $tag for merged PR #$pr_number at $sha"
            printf '%s\t%s\t%s\t%s\n' "$tag" "$sha" "$version" "$expected_asset" >> "$RUNNER_TEMP/releases.tsv"
          done < <(git rev-list --reverse --first-parent "$base_ref..origin/main")

          # Remove duplicate recovery/planning entries while preserving SemVer order.
          sort -u -V -k1,1 "$RUNNER_TEMP/releases.tsv" > "$RUNNER_TEMP/releases.sorted.tsv"
          mv "$RUNNER_TEMP/releases.sorted.tsv" "$RUNNER_TEMP/releases.tsv"

          echo "latest_tag=$(git tag --merged origin/main --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)" >> "$GITHUB_OUTPUT"

          release_lock
          trap - EXIT

          if [ -s "$RUNNER_TEMP/releases.tsv" ]; then
            echo "has_releases=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_releases=false" >> "$GITHUB_OUTPUT"
          fi

          python3 - <<'PY_MATRIX'
          import json, os
          from pathlib import Path
          rows = [dict(zip(("tag", "sha", "version", "asset_name"), line.split("\t")))
                  for line in Path(os.environ["RUNNER_TEMP"], "releases.tsv").read_text().splitlines()]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": rows}, separators=(",", ":")) + "\n")
          PY_MATRIX

  build:
    needs: plan
    if: needs.plan.outputs.has_releases == 'true'
    # Historical builds run on isolated ARM64 runners with read-only credentials.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and smoke-test release
        env:
          VERSION: ${{ matrix.version }}
          ASSET_NAME: ${{ matrix.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean test distZip -PreleaseVersion="$VERSION"
          asset="build/distributions/$ASSET_NAME"
          test -f "$asset"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$asset" "$RUNNER_TEMP/release-assets/"
          if [ "$ASSET_NAME" = "yame-$VERSION.zip" ]; then
            smoke_dir="$(mktemp -d)"
            unzip -q "$asset" -d "$smoke_dir"
            timeout 60s "$smoke_dir/yame-$VERSION/bin/yame" --list
            rm -rf "$smoke_dir"
            cp "$asset" "$RUNNER_TEMP/release-assets/yame-$VERSION-linux-arm64.zip"
          fi

      - name: Upload tested release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.tag }}
          path: ${{ runner.temp }}/release-assets/*.zip
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Limit publication API traffic; latest is selected by version, not job order.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # No checkout, Gradle, executable assets, or build cache in this job.
      - name: Download tested release assets
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.tag }}
          path: ${{ runner.temp }}/release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          LATEST_TAG: ${{ needs.plan.outputs.latest_tag }}
          TAG: ${{ matrix.tag }}
          SHA: ${{ matrix.sha }}
          ASSET_NAME: ${{ matrix.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN repository secret is required to publish releases"
            exit 1
          fi

          # Distinguish a missing release from permission/API failures. Do not hide
          # the original 403 behind a subsequent 'release not found' message.
          releases="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
          if ! grep -Fxq "$TAG" <<< "$releases"; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --target "$SHA" --title "$TAG" --generate-notes --draft
          fi

          test -f "$RUNNER_TEMP/release-assets/$ASSET_NAME"
          for asset in "$RUNNER_TEMP/release-assets/"*.zip; do
            asset_name="$(basename "$asset")"
            names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if ! grep -Fxq "$asset_name" <<< "$names"; then
              if ! gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"; then
                # Another recovery run may have uploaded the same immutable asset.
                names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
                grep -Fxq "$asset_name" <<< "$names" || exit 1
              fi
            fi
          done

          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true ]; then
            latest=false
            [ "$TAG" != "$LATEST_TAG" ] || latest=true
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
          fi
