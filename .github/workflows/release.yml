name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: 0.1.0-main.${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test release
        run: ./gradlew --no-daemon clean test distZip -PreleaseVersion="$RELEASE_VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$RELEASE_VERSION"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/distributions/*.zip --clobber

            if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "true" ]; then
              gh release edit "$tag" --draft=false --prerelease
            fi
          else
            gh release create "$tag" build/distributions/*.zip \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes \
              --prerelease
          fi
