name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    # Native ARM64 build for Raspberry Pi 3 (64-bit).
    runs-on: ubuntu-24.04-arm
    env:
      # main at the point automatic releases were introduced; this represents v0.1.0.
      RELEASE_BOOTSTRAP_SHA: 5fd66e4a3580ed3667ec65b0675ac28e611132ce

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Plan releases in main history order
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force origin main
          git fetch --force --tags origin

          lock_tag="release-version-lock"
          lock_acquired=false
          owned_lock_oid=""

          release_lock() {
            if [ "$lock_acquired" = true ] && [ -n "$owned_lock_oid" ]; then
              # Delete only the exact lock object this run created. If another run has
              # replaced it, --force-with-lease refuses to remove the new owner's lock.
              git push \
                --force-with-lease="refs/tags/$lock_tag:$owned_lock_oid" \
                origin ":refs/tags/$lock_tag" >/dev/null 2>&1 || true
              git tag -d "$lock_tag" >/dev/null 2>&1 || true
              lock_acquired=false
              owned_lock_oid=""
            fi
          }
          trap release_lock EXIT

          while [ "$lock_acquired" = false ]; do
            observed_lock_oid="$(
              git ls-remote --tags origin "refs/tags/$lock_tag" | awk '{print $1}'
            )"

            if [ -n "$observed_lock_oid" ]; then
              # Fetch and verify the exact object we observed before considering it
              # stale. The ref may have changed between ls-remote and fetch.
              if ! git fetch --force origin "refs/tags/$lock_tag:refs/tags/$lock_tag" >/dev/null 2>&1; then
                sleep 2
                continue
              fi

              fetched_lock_oid="$(git rev-parse "refs/tags/$lock_tag")"
              if [ "$fetched_lock_oid" != "$observed_lock_oid" ]; then
                sleep 2
                continue
              fi

              lock_time="$(
                git for-each-ref --format='%(taggerdate:unix)' "refs/tags/$lock_tag"
              )"
              now="$(date +%s)"

              if [ -n "$lock_time" ] && [ $((now - lock_time)) -gt 900 ]; then
                echo "Removing stale release version lock $observed_lock_oid"
                git push \
                  --force-with-lease="refs/tags/$lock_tag:$observed_lock_oid" \
                  origin ":refs/tags/$lock_tag" >/dev/null 2>&1 || true
                git tag -d "$lock_tag" >/dev/null 2>&1 || true
              else
                sleep 2
              fi
              continue
            fi

            git tag -d "$lock_tag" >/dev/null 2>&1 || true
            git tag -a "$lock_tag" -m "Release version lock for workflow run $GITHUB_RUN_ID" "origin/main"
            candidate_lock_oid="$(git rev-parse "refs/tags/$lock_tag")"

            if git push origin "refs/tags/$lock_tag" >/dev/null 2>&1; then
              lock_acquired=true
              owned_lock_oid="$candidate_lock_oid"
            else
              git tag -d "$lock_tag" >/dev/null 2>&1 || true
              sleep 2
            fi
          done

          # Refresh after acquiring the lock. A previous run may have created release tags
          # while this run was waiting.
          git fetch --force origin main
          git fetch --force --tags origin

          : > "$RUNNER_TEMP/releases.tsv"

          latest_tag="$(
            git tag --merged origin/main --list 'v*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          )"

          if [ -n "$latest_tag" ]; then
            base_ref="$latest_tag"
            current_version="${latest_tag#v}"
          else
            base_ref="$RELEASE_BOOTSTRAP_SHA"
            current_version="0.1.0"
          fi

          if ! git merge-base --is-ancestor "$base_ref" origin/main; then
            echo "::error::Release baseline $base_ref is not an ancestor of main"
            exit 1
          fi

          release_asset_name() {
            local commit="$1"
            local version="$2"

            # Commits before the repository rename still build the legacy distribution
            # name. Keep their release assets recoverable under that original name.
            if git show "$commit:settings.gradle.kts" 2>/dev/null |
              grep -Fq 'rootProject.name = "yame"'; then
              printf 'yame-%s.zip' "$version"
            else
              printf 'serial-modem-emulator-%s.zip' "$version"
            fi
          }

          # First recover any already-reserved SemVer tags whose release publication
          # previously failed, remained a draft, or is missing its expected ZIP asset.
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue

            version="${tag#v}"
            sha="$(git rev-list -n 1 "$tag")"
            expected_asset="$(release_asset_name "$sha" "$version")"
            needs_recovery=false

            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              needs_recovery=true
            else
              if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ]; then
                needs_recovery=true
              fi

              if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
                   grep -Fxq "$expected_asset"; then
                needs_recovery=true
              fi
            fi

            if [ "$needs_recovery" = true ]; then
              printf '%s\t%s\t%s\t%s\n' "$tag" "$sha" "$version" "$expected_asset" >> "$RUNNER_TEMP/releases.tsv"
            fi
          done < <(
            git tag --merged origin/main --list 'v*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V
          )

          # Process every not-yet-versioned first-parent commit, oldest first. This
          # preserves main history order even when workflow runs overlap or a single
          # push contains multiple merged PRs.
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue

            pr_number="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
                --jq ".[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$sha\") | .number" |
                tail -n 1
            )"

            if [ -z "$pr_number" ]; then
              echo "Skipping $sha: no merged PR terminates at this commit"
              continue
            fi

            labels="$(
              gh pr view "$pr_number" \
                --repo "$GITHUB_REPOSITORY" \
                --json labels \
                --jq '[.labels[].name] | join(",")'
            )"

            has_major=false
            has_minor=false
            case ",$labels," in
              *",release:major,"*) has_major=true ;;
            esac
            case ",$labels," in
              *",release:minor,"*) has_minor=true ;;
            esac

            if [ "$has_major" = true ] && [ "$has_minor" = true ]; then
              echo "::error::PR #$pr_number must not have both release:major and release:minor labels"
              exit 1
            fi

            IFS='.' read -r major minor patch <<< "$current_version"

            if [ "$has_major" = true ]; then
              major=$((major + 1))
              minor=0
              patch=0
            elif [ "$has_minor" = true ]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi

            version="$major.$minor.$patch"
            tag="v$version"

            git tag "$tag" "$sha"
            git push origin "refs/tags/$tag"
            current_version="$version"
            expected_asset="$(release_asset_name "$sha" "$version")"

            echo "Reserved $tag for merged PR #$pr_number at $sha"
            printf '%s\t%s\t%s\t%s\n' "$tag" "$sha" "$version" "$expected_asset" >> "$RUNNER_TEMP/releases.tsv"
          done < <(git rev-list --reverse --first-parent "$base_ref..origin/main")

          # Remove duplicate recovery/planning entries while preserving SemVer order.
          sort -u -V -k1,1 "$RUNNER_TEMP/releases.tsv" > "$RUNNER_TEMP/releases.sorted.tsv"
          mv "$RUNNER_TEMP/releases.sorted.tsv" "$RUNNER_TEMP/releases.tsv"

          release_lock
          trap - EXIT

          if [ -s "$RUNNER_TEMP/releases.tsv" ]; then
            echo "has_releases=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_releases=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish planned releases
        if: steps.plan.outputs.has_releases == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          while read -r tag sha version asset_name; do
            echo "Building $tag from $sha"
            git checkout --detach "$sha"

            ./gradlew --no-daemon clean test distZip -PreleaseVersion="$version"

            # The asset name travels with the planned release because historical
            # commits use the pre-rename Gradle project name.
            asset="build/distributions/$asset_name"

            # Smoke-test the ZIP on native ARM64 before publication. The JVM
            # distribution still uses the existing Gradle distZip packaging.
            arm64_asset_name=""
            if [ "$asset_name" = "yame-$version.zip" ]; then
              arm64_asset_name="yame-$version-linux-arm64.zip"
              smoke_dir="$(mktemp -d)"
              unzip -q "$asset" -d "$smoke_dir"
              timeout 60s "$smoke_dir/yame-$version/bin/yame" --list
              rm -rf "$smoke_dir"
              cp "$asset" "build/distributions/$arm64_asset_name"
            fi


            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              # Create the release state explicitly. Assets are uploaded separately so
              # a partial failure always leaves a recoverable draft.
              if ! gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$sha" \
                --title "$tag" \
                --generate-notes \
                --draft; then
                # A concurrent recovery run may have created it after our check.
                gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
              fi
            fi

            # Never clobber a healthy asset. If upload failed previously, recovery
            # planning detects the missing ZIP and retries it here.
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
                 grep -Fxq "$asset_name"; then
              if ! gh release upload "$tag" "$asset" \
                --repo "$GITHUB_REPOSITORY"; then
                # Another overlapping recovery run may have uploaded the same asset
                # after our existence check. Treat that conflict as success only if
                # the expected asset is now present; otherwise preserve the failure.
                if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
                   grep -Fxq "$asset_name"; then
                  echo "Asset $asset_name was uploaded concurrently; continuing"
                else
                  echo "::error::Failed to upload $asset_name for $tag"
                  exit 1
                fi
              fi
            fi

            if [ -n "$arm64_asset_name" ]; then
              if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
                   grep -Fxq "$arm64_asset_name"; then
                if ! gh release upload "$tag" "build/distributions/$arm64_asset_name" --repo "$GITHUB_REPOSITORY"; then
                  if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
                       grep -Fxq "$arm64_asset_name"; then
                    echo "::error::Failed to upload $arm64_asset_name for $tag"
                    exit 1
                  fi
                fi
              fi
            fi

            # Publish only after both assets are present. This covers both fresh
            # drafts and drafts recovered from an earlier failed upload.
            if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ]; then
              gh release edit "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --draft=false
            fi
          done < "$RUNNER_TEMP/releases.tsv"
