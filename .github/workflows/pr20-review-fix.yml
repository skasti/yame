name: PR20 review fix

on:
  push:
    branches:
      - fix/http-compatibility-default-and-links

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/http-compatibility-default-and-links
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply review fixes
        run: python .github/pr20_patch.py
      - name: Test
        run: ./gradlew test
      - name: Commit fixes and remove helper
        run: |
          git rm .github/workflows/pr20-review-fix.yml .github/pr20_patch.py
          git add src/main/kotlin/no/skasti/serialmodem/ppp/HttpCompatibilityProxy.kt src/test/kotlin/no/skasti/serialmodem/ppp/HttpCompatibilityReviewRegressionTest.kt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Fix remaining HTTP compatibility review findings'
          git push origin HEAD:fix/http-compatibility-default-and-links
