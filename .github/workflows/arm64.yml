name: Linux ARM64

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  preview-gate:
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.gate.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-ci
          persist-credentials: false
      - name: Verify screenshot-only successor
        if: github.event_name == 'pull_request'
        id: gate
        uses: actions/github-script@v8
        with:
          script: |
            const gatePath = './trusted-ci/scripts/ci/tui-previews.cjs';
            if (require('node:fs').existsSync(gatePath)) {
              await require(gatePath).gate({github, context, core}, {requireArm64: true});
            } else {
              // Introducing PR: no gate on the base yet, so always run full CI.
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: context.payload.pull_request.number});
              const {data: merge} = await github.rest.git.getCommit({...context.repo, commit_sha: context.sha});
              if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha ||
                  merge.parents.length !== 2 || merge.parents[0].sha !== pr.base.sha || merge.parents[1].sha !== pr.head.sha) {
                throw new Error('PR head/base changed; rerun CI');
              }
              core.setOutput('reuse', 'false');
              core.setOutput('checkout_ref', context.sha);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('base_sha', pr.base.sha);
              core.setOutput('pr_number', pr.number);
            }

  test:
    needs: preview-gate
    if: needs.preview-gate.outputs.reuse != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build, test, and package
        run: ./gradlew --no-daemon clean test distZip

      - name: Smoke-test packaged CLI
        shell: bash
        run: |
          set -euo pipefail
          dist="$(find build/distributions -maxdepth 1 -name 'yame-*.zip' -print -quit)"
          test -n "$dist"
          mkdir -p "$RUNNER_TEMP/yame-smoke"
          unzip -q "$dist" -d "$RUNNER_TEMP/yame-smoke"
          launcher="$(find "$RUNNER_TEMP/yame-smoke" -path '*/bin/yame' -type f -print -quit)"
          test -n "$launcher"
          timeout 60s "$launcher" --list
