name: PR20 Codex round 8 fix

on:
  push:
    branches: [fix/http-compatibility-default-and-links]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 .github/scripts/pr20_round8_fix.py
      - run: ./gradlew test
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr20-codex-round8.yml .github/scripts/pr20_round8_fix.py
          git add src/main/kotlin/no/skasti/serialmodem/ppp/HttpCompatibilityProxy.kt src/test/kotlin/no/skasti/serialmodem/ppp/CodexRound8RegressionTest.kt
          git commit -m "Address latest Codex HTTP compatibility feedback"
          git push origin HEAD:fix/http-compatibility-default-and-links
