name: PR20 Codex round 7 patch

on:
  push:
    branches:
      - fix/http-compatibility-default-and-links

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/http-compatibility-default-and-links
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply review fixes
        run: python3 scripts/pr20_codex_round7.py
      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test
      - name: Commit fixes
        run: |
          rm -f .github/workflows/pr20-codex-round7.yml scripts/pr20_codex_round7.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Address latest HTTP compatibility review feedback"
          git push origin HEAD:fix/http-compatibility-default-and-links
