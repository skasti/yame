name: Apply Codex round 4 fixes

on:
  push:
    branches:
      - fix/http-compatibility-default-and-links
    paths:
      - tools/apply-codex-round4.py
      - .github/workflows/apply-codex-round4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/http-compatibility-default-and-links
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply targeted source and regression-test patch
        run: python tools/apply-codex-round4.py
      - name: Run focused tests
        run: ./gradlew test --tests no.skasti.serialmodem.ppp.HttpCompatibilityReviewRegressionTest
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/kotlin/no/skasti/serialmodem/ppp/HttpCompatibilityProxy.kt src/test/kotlin/no/skasti/serialmodem/ppp/HttpCompatibilityReviewRegressionTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "Preserve redirected document bases and HTML URL mappings"
          git push
