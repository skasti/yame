name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Install DOSBox integration-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes dosbox socat xvfb xauth

      - name: DOSBox dial-up PPP and DNS compatibility suite
        run: bash scripts/dosbox-network-integration-test.sh
