name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-gate:
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.gate.outputs.reuse }}
      checkout_ref: ${{ steps.gate.outputs.checkout_ref }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-ci
          persist-credentials: false
      - name: Verify screenshot-only successor
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const gatePath = './trusted-ci/scripts/ci/tui-previews.cjs';
            if (require('node:fs').existsSync(gatePath)) {
              await require(gatePath).gate({github, context, core});
            } else {
              // Introducing PR: no gate on the base yet, so always run full CI.
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: context.payload.pull_request.number});
              const {data: merge} = await github.rest.git.getCommit({...context.repo, commit_sha: context.sha});
              if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha ||
                  merge.parents.length !== 2 || merge.parents[0].sha !== pr.base.sha || merge.parents[1].sha !== pr.head.sha) {
                throw new Error('PR head/base changed; rerun CI');
              }
              core.setOutput('reuse', 'false');
              core.setOutput('checkout_ref', context.sha);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('base_sha', pr.base.sha);
              core.setOutput('pr_number', pr.number);
            }

  release-workflow-tests:
    needs: preview-gate
    if: needs.preview-gate.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test release workflow
        run: |
          python3 -m pip install PyYAML
          python3 -m unittest discover -s tests -p 'test_release_workflow.py'
          python3 -m unittest discover -s tests -p 'test_tui_previews.py'
          python3 -m unittest discover -s tests -p 'test_dosbox_downloads.py'
          node --test tests/tui-previews.test.cjs tests/render-tui-previews.test.cjs tests/font-metrics.test.cjs

  build-and-test:
    needs: preview-gate
    # Keep the required check present, and fail if the gate itself failed.
    if: always()
    runs-on: ubuntu-latest
    env:
      YAME_DOSBOX_DOWNLOAD_CACHE: ${{ github.workspace }}/.cache/dosbox-network

    steps:
      - name: Require successful gate
        env:
          GATE_RESULT: ${{ needs.preview-gate.result }}
        run: test "$GATE_RESULT" = success

      - name: Reuse verified build for screenshot-only commit
        if: needs.preview-gate.outputs.reuse == 'true'
        run: echo 'Only generated screenshots changed; the parent passed CI against the same base.'

      - name: Check out repository
        if: needs.preview-gate.outputs.reuse != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preview-gate.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up JDK 21
        if: needs.preview-gate.outputs.reuse != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: needs.preview-gate.outputs.reuse != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        if: needs.preview-gate.outputs.reuse != 'true'
        run: ./gradlew --no-daemon clean build

      - name: Upload image transformation visual report
        id: image-gallery
        if: always() && needs.preview-gate.outputs.reuse != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: yame-image-transformations
          path: build/reports/image-transformations/
          if-no-files-found: warn
          retention-days: 30

      - name: Link image gallery in job summary
        if: steps.image-gallery.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.image-gallery.outputs.artifact-url }}
        run: |
          echo '### Image transformation examples' >> "$GITHUB_STEP_SUMMARY"
          echo "Download the [visual gallery]($ARTIFACT_URL), unzip and open index.html." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js for Termless preview rendering
        if: needs.preview-gate.outputs.reuse != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install test-only terminal renderer
        if: needs.preview-gate.outputs.reuse != 'true'
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install pinned JetBrainsMono Nerd Font Mono
        if: needs.preview-gate.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/JetBrainsMono-v3.5.1.tar.xz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/JetBrainsMono.tar.xz
          echo "04d5e8f903693f9dd13e16f867e994834e681eb3c72c0d337a770dcda09010cf  $archive" | sha256sum --check
          font_dir="$HOME/.local/share/fonts/yame-preview"
          mkdir -p "$font_dir"
          tar --extract --xz --file "$archive" --directory "$font_dir" \
            --wildcards --no-anchored 'JetBrainsMonoNerdFontMono-*.ttf'
          fc-cache --force "$font_dir"
          fc-match -f '%{family}: %{style}\\n' 'JetBrainsMono Nerd Font Mono:style=Regular'

      # Compare only to files from the immutable PR base, not the PR checkout.
      - name: Check out immutable screenshot baseline
        if: needs.preview-gate.outputs.reuse != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preview-gate.outputs.base_sha }}
          path: trusted-preview-base
          persist-credentials: false

      - name: Render ANSI snapshots through xterm.js
        if: needs.preview-gate.outputs.reuse != 'true'
        env:
          YAME_TUI_BASELINE_DIR: ${{ github.workspace }}/trusted-preview-base/assets/screenshots
        run: npm run render:tui-previews

      - name: Record tested preview source
        if: needs.preview-gate.outputs.reuse != 'true'
        uses: actions/github-script@v9
        env:
          PREVIEW_HEAD: ${{ needs.preview-gate.outputs.head_sha }}
          PREVIEW_BASE: ${{ needs.preview-gate.outputs.base_sha }}
          PREVIEW_MERGE: ${{ needs.preview-gate.outputs.checkout_ref }}
          PREVIEW_PR: ${{ needs.preview-gate.outputs.pr_number }}
        with:
          script: |
            require('node:fs').writeFileSync('build/reports/tui-screenshots/source.json', JSON.stringify({
              run: Number(context.runId), pr: Number(process.env.PREVIEW_PR),
              head: process.env.PREVIEW_HEAD, base: process.env.PREVIEW_BASE, merge: process.env.PREVIEW_MERGE
            }));

      - name: Upload TUI screenshots
        if: needs.preview-gate.outputs.reuse != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: yame-tui-screenshots-v3
          path: build/reports/tui-screenshots/
          if-no-files-found: error
          retention-days: 30

      # The script owns the pinned URLs/versions and SHA-1 digests. Updating any
      # pin changes this exact key; do not add restore-keys for older pins.
      - name: Cache DOSBox dependency archives
        if: needs.preview-gate.outputs.reuse != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.YAME_DOSBOX_DOWNLOAD_CACHE }}
          key: ${{ runner.os }}-dosbox-archives-v1-${{ hashFiles('scripts/dosbox-network-downloads.sh') }}

      - name: Prepare checksum-verified DOSBox dependency archives
        if: needs.preview-gate.outputs.reuse != 'true'
        run: bash scripts/dosbox-network-downloads.sh "$YAME_DOSBOX_DOWNLOAD_CACHE"

      - name: Install DOSBox integration-test dependencies
        if: needs.preview-gate.outputs.reuse != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes dosbox socat xvfb xauth

      - name: DOSBox dial-up PPP, DNS and TCP compatibility suite
        if: needs.preview-gate.outputs.reuse != 'true'
        run: bash scripts/dosbox-network-integration-test.sh

      # External availability is outside YAME's control. Report the smoke
      # failure but never fail an otherwise healthy pull request.
      - name: DOSBox external HTTP smoke test (Microsoft Connect Test)
        if: needs.preview-gate.outputs.reuse != 'true'
        continue-on-error: true
        run: bash scripts/dosbox-network-integration-test.sh external-smoke
