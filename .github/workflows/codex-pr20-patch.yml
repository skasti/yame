name: Codex PR20 patch

on:
  push:
    branches:
      - fix/http-compatibility-default-and-links
    paths:
      - .github/workflows/codex-pr20-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/http-compatibility-default-and-links
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/codex_pr20_fix.py
      - name: Run focused tests
        run: ./gradlew test --tests no.skasti.serialmodem.ppp.LegacyOriginRouteTableTest
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/kotlin/no/skasti/serialmodem/ppp/HttpCompatibilityProxy.kt src/test/kotlin/no/skasti/serialmodem/ppp/LegacyHttpsUrlCodecTest.kt
          git commit -m "Fix HTTPS base routing and inline CSS rewriting"
          git push
