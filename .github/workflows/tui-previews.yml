name: Publish TUI previews

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: tui-previews-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      statuses: write
      pull-requests: write
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate source run and live PR
        id: source
        uses: actions/github-script@v8
        with:
          script: await require('./scripts/ci/tui-previews.cjs').prepare({github, context, core})
      - name: Download bounded preview ZIP
        if: steps.source.outputs.publish == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo, run_id: context.payload.workflow_run.id});
            const artifact = artifacts.find(a => a.name === 'yame-tui-screenshots' && !a.expired);
            if (!artifact || artifact.size_in_bytes > 5 * 1024 * 1024) throw new Error('Invalid preview archive size');
            const {data} = await github.rest.actions.downloadArtifact({...context.repo, artifact_id: artifact.id, archive_format: 'zip'});
            const bytes = Buffer.from(data);
            if (bytes.length > 5 * 1024 * 1024) throw new Error('Preview ZIP exceeds limit');
            require('node:fs').writeFileSync(require('node:path').join(process.env.RUNNER_TEMP, 'tui-previews.zip'), bytes);
      - name: Validate and extract bounded preview files
        if: steps.source.outputs.publish == 'true'
        env:
          PREVIEW_ZIP: ${{ runner.temp }}/tui-previews.zip
          PREVIEW_DIRECTORY: ${{ runner.temp }}/tui-previews
        run: python3 scripts/ci/extract-tui-previews.py "$PREVIEW_ZIP" "$PREVIEW_DIRECTORY"
      - name: Commit previews, verify successor and update PR comment
        if: steps.source.outputs.publish == 'true'
        uses: actions/github-script@v8
        env:
          PREVIEW_PR: ${{ steps.source.outputs.pr_number }}
          PREVIEW_DIRECTORY: ${{ runner.temp }}/tui-previews
        with:
          script: await require('./scripts/ci/tui-previews.cjs').publish({github, context, core}, process.env.PREVIEW_PR, process.env.PREVIEW_DIRECTORY)
