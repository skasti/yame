name: Temporary PR 20 review fixes
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/http-compatibility-default-and-links
          fetch-depth: 0
      - name: Patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-fix-pr20-review.yml
          git add src/main/kotlin/no/skasti/serialmodem/ppp/HttpCompatibilityProxy.kt
          git commit -m 'Fix legacy base routing auth and CSS URL parsing'
          git push origin HEAD:fix/http-compatibility-default-and-links
